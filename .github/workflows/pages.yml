name: Deploy demo and API docs to Pages

# Builds the wasmJs sample and the Dokka API reference on every push to main and
# publishes them together to a single Pages site:
#   https://shivathapaa.github.io/KMP-Logger/      -> live demo
#   https://shivathapaa.github.io/KMP-Logger/api/  -> API reference
#
# Pages has one live environment per repo, so both share a single artifact: the
# demo sits at the site root and the Dokka HTML is nested under api/.
#
# PRs do NOT trigger this: Pages has a single live environment and PR
# previews would either burn quota or fight for the deploy lock. PR
# branches still get a build via ci.yml, just no deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

# Force JS-based actions onto Node 24 ahead of GitHub's Node cutover. Only needed
# for actions that haven't shipped a Node 24 major yet, currently the
# gradle/actions/* family.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build wasmJs distribution
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read kmplogger.version
        id: version
        run: |
          v=$(grep '^kmplogger.version=' gradle.properties | cut -d'=' -f2)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved kmplogger.version=$v"

      - name: Build wasmJs production bundle
        run: ./gradlew :sample:composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Generate API docs (Dokka multi-module HTML)
        run: ./gradlew :dokkaGeneratePublicationHtml --stacktrace

      - name: Substitute version banner
        run: |
          dist=sample/composeApp/build/dist/wasmJs/productionExecutable
          sed -i "s/__VERSION__/${{ steps.version.outputs.value }}/g" "$dist/index.html"

      - name: Strip JS sourcemap from deploy (saves bandwidth per visitor)
        run: |
          dist=sample/composeApp/build/dist/wasmJs/productionExecutable
          rm -f "$dist/composeApp.js.map"

      - name: Nest API docs under /api of the demo bundle
        run: |
          dist=sample/composeApp/build/dist/wasmJs/productionExecutable
          mkdir -p "$dist/api"
          cp -r build/dokka/html/. "$dist/api/"

      - name: Report bundle size
        run: |
          dist=sample/composeApp/build/dist/wasmJs/productionExecutable
          echo "## Bundle contents" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h "$dist"/* | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Total transferred (gzipped) estimate:" >> "$GITHUB_STEP_SUMMARY"
          ( cd "$dist" && find . -type f -exec gzip -c {} \; | wc -c ) \
            | awk '{ printf "**%.2f MB**\n", $1/1024/1024 }' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sample/composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
